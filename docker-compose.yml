# GLM-5.3-Flash NVFP4 on 2x DGX Spark (GB10) with vLLM TP=2.
# Symmetric service: rank-specific values (NODE_RANK / HEADLESS / VLLM_HOST_IP)
# are passed by scripts/start-head.sh and scripts/start-worker.sh, everything
# else comes from cluster.env (--env-file). Derived from
# ../dgx-spark-2node-v4flash-dspark-vllm/recipe-tonyd2wild/docker-compose.dspark.yml
# with: GLM image/flags, UCX_NET_DEVICES added, VLLM_HOST_IP passed in (no bash
# branch), autotune cache persisted, worker started from the Mac (not via node2).
# Tuning (2026-08-31): MTP_NUM_TOKENS=0 / ENFORCE_EAGER=0 / KV_CACHE_MEMORY_BYTES= drop the
# corresponding flag; every knob can be overridden per launch via OVERRIDES="K=V ..." in
# scripts/start-*.sh (shell env wins over --env-file in compose interpolation).
services:
  vllm-glm53:
    image: ${IMAGE}
    network_mode: host
    ipc: host
    shm_size: "64gb"

    ulimits:
      memlock: -1
      stack: 67108864

    gpus: all

    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      - ${HOME}/models:/models:ro
      - ${HOME}/.cache/glm53-vllm:/root/.cache   # FlashInfer autotune / torch / triton caches survive restarts
      # tonyd2wild SM121 top-k fix (required by the v11 README on both nodes; 2-line diff vs stock:
      # pool_topk init -1, and persistent_topk only on parts with >= 78 SMs — GB10 has 48 / 99KB smem)
      - ${HOME}/glm53-cluster/patches/sparse_attn_indexer_kpool_sm121.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/sparse_attn_indexer_kpool.py:ro
      - ${HOME}/glm53-cluster/patches/utf8_guard_lp.py:/opt/glm53/utf8_guard_lp.py:ro   # UTF-8 guard logits processor (opt-in via LOGITS_PROCESSORS)

    environment:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_XET: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "${VLLM_ENGINE_READY_TIMEOUT_S:-3600}"
      VLLM_HOST_IP: "${VLLM_HOST_IP}"   # rank 0: MASTER_ADDR, rank 1: WORKER_IP (set by start-*.sh)
      TORCH_CUDA_ARCH_LIST: "${TORCH_CUDA_ARCH_LIST:-12.1a}"
      FLASHINFER_CUDA_ARCH_LIST: "${FLASHINFER_CUDA_ARCH_LIST:-12.1a}"
      PYTORCH_CUDA_ALLOC_CONF: "${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}"

      NCCL_NET: "${NCCL_NET:-IB}"
      NCCL_IB_DISABLE: "${NCCL_IB_DISABLE:-0}"
      NCCL_IB_HCA: "${NCCL_IB_HCA}"
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-}"
      NCCL_CROSS_NIC: "${NCCL_CROSS_NIC:-1}"
      NCCL_CUMEM_ENABLE: "${NCCL_CUMEM_ENABLE:-0}"
      NCCL_IGNORE_CPU_AFFINITY: "${NCCL_IGNORE_CPU_AFFINITY:-1}"
      NCCL_DEBUG: "${NCCL_DEBUG:-WARN}"
      NCCL_NVLS_ENABLE: "${NCCL_NVLS_ENABLE:-0}"
      GLOO_SOCKET_IFNAME: "${GLOO_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}"
      TP_SOCKET_IFNAME: "${TP_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}"
      MN_IF_NAME: "${MN_IF_NAME:-${NCCL_SOCKET_IFNAME}}"
      UCX_NET_DEVICES: "${UCX_NET_DEVICES:-${NCCL_SOCKET_IFNAME}}"
      OMPI_MCA_btl_tcp_if_include: "${OMPI_MCA_btl_tcp_if_include:-${NCCL_SOCKET_IFNAME}}"

      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS:-}"
      # tuning knobs resolved by the in-container bash (see command): 0 / empty drops the flag
      MTP_NUM_TOKENS: "${MTP_NUM_TOKENS:-4}"          # num_speculative_tokens for either method
      SPEC_METHOD: "${SPEC_METHOD:-mtp}"              # mtp | dflash (dflash needs SPEC_MODEL)
      SPEC_MODEL: "${SPEC_MODEL:-}"                   # container path of the drafter, e.g. /models/GLM-5.3-Flash-DFlash2
      ENFORCE_EAGER: "${ENFORCE_EAGER:-1}"
      KV_CACHE_MEMORY_BYTES: "${KV_CACHE_MEMORY_BYTES:-}"
      FLASHINFER_AUTOTUNE: "${FLASHINFER_AUTOTUNE:-1}"  # 0 = --kernel-config autotune/cutedsl warmup off (Ama5u)
      LOGITS_PROCESSORS: "${LOGITS_PROCESSORS:-}"       # e.g. utf8_guard_lp:Utf8GuardLogitsProcessor (rejected while speculative decoding is on)
      PYTHONPATH: "/opt/glm53"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-25000}"

    # One shell string so that ${HEADLESS:+--headless} can expand to nothing on
    # the head. Compose interpolates ${...} first; $$ is left for the shell.
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >
        SPEC=""; if [ "$${MTP_NUM_TOKENS:-0}" != "0" ]; then if [ -n "$${SPEC_MODEL:-}" ]; then SPEC="--speculative-config {\"method\":\"$${SPEC_METHOD:-mtp}\",\"model\":\"$${SPEC_MODEL}\",\"num_speculative_tokens\":$${MTP_NUM_TOKENS}}"; else SPEC="--speculative-config {\"method\":\"$${SPEC_METHOD:-mtp}\",\"num_speculative_tokens\":$${MTP_NUM_TOKENS}}"; fi; fi;
        EAGER=""; if [ "$${ENFORCE_EAGER:-1}" = "1" ]; then EAGER="--enforce-eager"; fi;
        KVB=""; if [ -n "$${KV_CACHE_MEMORY_BYTES:-}" ]; then KVB="--kv-cache-memory-bytes $${KV_CACHE_MEMORY_BYTES}"; fi;
        KC=""; if [ "$${FLASHINFER_AUTOTUNE:-1}" = "0" ]; then KC="--kernel-config {\"enable_cutedsl_warmup\":false,\"enable_flashinfer_autotune\":false}"; fi;
        LP=""; if [ -n "$${LOGITS_PROCESSORS:-}" ]; then LP="--logits-processors $${LOGITS_PROCESSORS}"; fi;
        echo "[glm53] rank=$${NODE_RANK} spec='$$SPEC' eager='$$EAGER' kvb='$$KVB' kc='$$KC'";
        exec vllm serve ${MODEL_DIR}
        --served-model-name ${SERVED_MODEL_NAME}
        --host ${VLLM_HOST:-127.0.0.1}
        --port ${PORT:-8888}
        --tensor-parallel-size 2
        --distributed-executor-backend mp
        --nnodes 2
        --node-rank ${NODE_RANK}
        --master-addr ${MASTER_ADDR}
        --master-port ${MASTER_PORT:-25000}
        ${HEADLESS:+--headless}
        --language-model-only
        --kv-cache-dtype ${KV_CACHE_DTYPE:-fp8}
        --block-size ${BLOCK_SIZE}
        $$KVB
        --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS}
        --max-model-len ${MAX_MODEL_LEN}
        --max-num-seqs ${MAX_NUM_SEQS}
        --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION}
        --moe-backend ${MOE_BACKEND}
        $$EAGER
        --tool-call-parser ${TOOL_CALL_PARSER}
        --enable-auto-tool-choice
        --reasoning-parser ${REASONING_PARSER}
        $$SPEC
        $$KC
        $$LP
        --trust-remote-code
        ${VLLM_EXTRA_ARGS:-}
